name: key-fingerprint
on: { workflow_dispatch: {} }
jobs:
  fp:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/k.jks
          keytool -list -v -keystore /tmp/k.jks -alias ${{ secrets.ANDROID_KEY_ALIAS }} -storepass '${{ secrets.ANDROID_STORE_PASSWORD }}' | grep -i sha256
          shred -u /tmp/k.jks