name: cofiz
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  google_fonts: ^6.3.3
  percent_indicator: ^4.2.5
  flutter_animate: ^4.5.2

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.2.0

  provider: ^6.1.1

  shared_preferences: ^2.2.2

  intl: ^0.20.2

  url_launcher: ^6.2.5

  fl_chart: ^0.66.2

  image_picker: ^1.2.1
  image: ^4.5.4
  http: ^1.2.0

  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.0.0
  package_info_plus: ^8.0.0
  flutter_dotenv: ^5.2.0
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.0.0
  uuid: ^4.6.0
  app_links: ^6.3.0
  crypto: ^3.0.0
  ethio_calendar: ^0.1.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^3.1.0

flutter:

  uses-material-design: true
  generate: true

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/DM-Sans-Variable.ttf

  assets:
    - .env
    - assets/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon-bg.jpg"
  adaptive_icon_background: "#F7F7F7"
  adaptive_icon_foreground: "assets/icon-bgless.png"
